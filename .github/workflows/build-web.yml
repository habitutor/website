# For more details, read this: https://coolify.io/docs/github-actions
name: Deploy Web
on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "packages/**"

jobs:
  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install dependencies
        run: bun install
      - name: Install tsgo globally
        run: bun install -g @typescript/native-preview
      - name: Build packages
        run: bun build:packages
      - name: Lint
        run: bun lint:linter
      - name: Check types
        run: |
          echo "~/.bun/bin" >> $GITHUB_PATH
          bun check-types

  deploy:
    needs: check-types
    runs-on: ubuntu-latest
    steps:
      # The web app is built from source by Coolify; this only triggers the deployment.
      # COOLIFY_WEBHOOK_WEB (web app's own deploy webhook) takes precedence when set,
      # otherwise falls back to the shared COOLIFY_WEBHOOK used by the server workflow.
      - name: Deploy to Coolify
        run: |
          curl --fail-with-body --request POST '${{ secrets.COOLIFY_WEBHOOK_WEB || secrets.COOLIFY_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
